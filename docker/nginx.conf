server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.web.html;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /index.web.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.web.html;
    }

    location ~* \.(?:css|js|wasm|woff2?|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        try_files $uri =404;
    }
}
